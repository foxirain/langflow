name: Claude Branch Injection Canary

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  canary:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR branch
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput("pr_branch", pr.data.head.ref);
            core.notice(`PR branch: ${pr.data.head.ref}`);

      - name: Vulnerable fetch reproduction
        run: |
          echo "BEGIN vulnerable line"
          git fetch origin pull/${{ github.event.issue.number }}/head:${{ steps.pr.outputs.pr_branch }}
          echo "END vulnerable line"

      - name: Next step canary
        run: |
          resolved="$(command -v gh || true)"
          echo "resolved_gh=$resolved"
          gh P0_CANARY_ARGUMENT || true

          if [ "$resolved" = "/tmp/p0canary/gh" ]; then
            echo "P0_CHAIN_PROOF: branch-controlled GITHUB_PATH changed later gh resolution"
          else
            echo "P0_CHAIN_PROOF_FAILED: gh was not branch-controlled"
            exit 1
          fi
